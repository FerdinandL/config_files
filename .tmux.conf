#remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# set default terminal colors
set -g default-terminal "xterm-256color"

# split panes using \ and -
bind-key \\ split-window -h
bind-key - split-window -v
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Fix for Ctrl+Left and Ctrl+Right in tmux
bind -n C-Left send-keys M-b
bind -n C-Right send-keys M-f

# To scroll in terminal: C-a + [

# Swap current window left/right (prefix + Shift+Arrow), keeping focus on the window
bind -r S-Left  swap-window -t -1 \; previous-window
bind -r S-Right swap-window -t +1 \; next-window

# Keep window numbers consecutive: shift higher indices down when a window closes
set -g renumber-windows on
